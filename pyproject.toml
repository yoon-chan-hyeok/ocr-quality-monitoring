[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "label-free-ocr-embedding-monitor"
version = "0.1.0"
description = "Black-box, label-free OCR anomaly monitoring with text embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OCR Embedding Monitor contributors"}]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=3.0",
  "torch>=2.2",
]
dev = ["pytest>=8.0"]

[project.scripts]
ocr-embedding-monitor = "ocr_embedding_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

