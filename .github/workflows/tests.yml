name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Smoke run without model download
        run: >-
          python -m ocr_embedding_monitor
          --baseline examples/baseline.jsonl
          --candidate examples/candidate_corrupted.jsonl
          --backend hash
          --output-dir outputs/ci-smoke

