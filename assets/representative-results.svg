<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">대표 OCR failure-risk 실험 결과</title>
  <desc id="desc">FUNSD 전체 열화와 CORD 영문자 불일치 조건에서 OCR confidence와 결합 신호의 AUPRC를 비교한다.</desc>
  <rect width="1200" height="540" rx="22" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="492" rx="18" fill="#ffffff" stroke="#dbe3ea"/>
  <rect x="52" y="48" width="5" height="48" rx="2.5" fill="#0f766e"/>
  <text x="72" y="75" fill="#0f172a" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="30" font-weight="800">Representative failure-risk results</text>
  <text x="72" y="102" fill="#64748b" font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif" font-size="15">AUPRC, selected conditions. 전체 조건 평균이 아닙니다.</text>

  <g font-family="Pretendard, Noto Sans KR, Segoe UI, sans-serif">
    <line x1="120" y1="420" x2="1080" y2="420" stroke="#cbd5e1"/>
    <line x1="120" y1="340" x2="1080" y2="340" stroke="#e2e8f0"/>
    <line x1="120" y1="260" x2="1080" y2="260" stroke="#e2e8f0"/>
    <line x1="120" y1="180" x2="1080" y2="180" stroke="#e2e8f0"/>
    <line x1="120" y1="100" x2="1080" y2="100" stroke="#e2e8f0"/>
    <g fill="#64748b" font-size="13" text-anchor="end">
      <text x="108" y="424">0.0</text>
      <text x="108" y="344">0.25</text>
      <text x="108" y="264">0.50</text>
      <text x="108" y="184">0.75</text>
      <text x="108" y="104">1.0</text>
    </g>

    <rect x="210" y="154.6" width="120" height="265.4" rx="5" fill="#94a3b8"/>
    <rect x="350" y="149.5" width="120" height="270.5" rx="5" fill="#0f766e"/>
    <rect x="720" y="231.0" width="120" height="189.0" rx="5" fill="#94a3b8"/>
    <rect x="860" y="199.1" width="120" height="220.9" rx="5" fill="#0f766e"/>

    <g fill="#0f172a" font-size="18" font-weight="800" text-anchor="middle">
      <text x="270" y="143">0.8295</text>
      <text x="410" y="138">0.8454</text>
      <text x="780" y="219">0.5907</text>
      <text x="920" y="187">0.6904</text>
    </g>
    <g fill="#334155" font-size="15" text-anchor="middle">
      <text x="270" y="448">Confidence</text>
      <text x="410" y="448">+ Direction</text>
      <text x="780" y="448">Confidence</text>
      <text x="920" y="448">+ kNN5</text>
    </g>
    <g fill="#0f172a" font-size="19" font-weight="700" text-anchor="middle">
      <text x="340" y="492">FUNSD 전체 degradation</text>
      <text x="850" y="492">CORD alphabetic mismatch</text>
    </g>
  </g>
</svg>
